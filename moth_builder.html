<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Moth Generator</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
        --bg: #f6f3ee;
        --fg: #2a2622;
        --card: #fffdf9;
        --line: #ddd5c8;
        --acc: #7a5c3a;
        --mut: #7d746a;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #16140f;
          --fg: #ece6da;
          --card: #1f1c16;
          --line: #3a352b;
          --acc: #d2b17a;
          --mut: #9a9082;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #16140f;
        --fg: #ece6da;
        --card: #1f1c16;
        --line: #3a352b;
        --acc: #d2b17a;
        --mut: #9a9082;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: minmax(330px, 430px) minmax(0, 1fr);
        gap: 14px;
        padding: 12px;
        max-width: 1300px;
        margin: 0 auto;
      }
      #stagewrap {
        position: sticky;
        top: 12px;
        align-self: start;
        order: 2;
      }
      #stage {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px;
      }
      #stage svg {
        display: block;
        width: 100%;
        max-height: 78vh;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #name {
        color: var(--acc);
      }
      .side {
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        min-height: 60vh;
        order: 1;
      }
      nav {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: rgba(128, 110, 80, 0.07);
      }
      nav button {
        border: 0;
        border-radius: 0;
        text-align: left;
        padding: 10px 12px;
        background: none;
        border-left: 3px solid transparent;
      }
      nav button.on {
        border-left-color: var(--acc);
        color: var(--acc);
        background: var(--card);
        font-weight: 600;
      }
      #panel {
        padding: 10px 14px;
        max-height: 84vh;
        overflow-y: auto;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: var(--fg);
      }
      button {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--acc);
      }
      label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        align-items: center;
        margin: 7px 0;
        font-size: 13px;
      }
      label input[type="range"] {
        grid-column: 1/3;
        width: 100%;
        accent-color: var(--acc);
      }
      label output {
        color: var(--mut);
        font-variant-numeric: tabular-nums;
      }
      label.c,
      label.t {
        grid-template-columns: auto 1fr;
        justify-items: start;
      }
      label.c {
        grid-template-columns: 1fr auto;
      }
      select,
      textarea,
      input[type="number"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px;
      }
      label > select {
        grid-column: 1/3;
      }
      label > textarea {
        grid-column: 1/3;
        font: 11px monospace;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 10px 0;
        padding: 4px 10px 10px;
      }
      legend {
        font-weight: 600;
        color: var(--acc);
      }
      .item {
        border-top: 1px dashed var(--line);
        margin-top: 6px;
        padding-top: 4px;
      }
      .item b {
        color: var(--mut);
      }
      .item button {
        float: right;
        padding: 1px 7px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      button.on {
        border-color: var(--acc);
        color: var(--acc);
        font-weight: 600;
      }
      .note {
        color: var(--mut);
        font-size: 12px;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }
        #stagewrap {
          position: static;
          order: 1;
        }
        .side {
          order: 2;
          grid-template-columns: 1fr;
        }
        nav {
          flex-direction: row;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        nav button {
          white-space: nowrap;
          border-left: 0;
          border-bottom: 3px solid transparent;
        }
        nav button.on {
          border-bottom-color: var(--acc);
        }
        #panel {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="stagewrap">
        <h1>Moth generator <span id="name"></span></h1>
        <div class="row">
          <button data-view="top">Top view</button
          ><button data-view="bottom">Bottom view</button
          ><button data-view="left">Left</button
          ><button data-view="right">Right</button
          ><span style="flex: 1"></span><button id="svgb">Save SVG</button
          ><button id="pngb">Save PNG</button
          ><button id="rigb">Save rig SVG</button>
        </div>
        <div id="stage"></div>
      </div>
      <div class="side">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </div>
    </div>
    <script src="moth_builder.js"></script>

  </body>
</html>
