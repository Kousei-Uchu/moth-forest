   if(a>.004){const gx=(Hh[yy*cw+Math.min(xx+1,cw-1)]-Hh[yy*cw+Math.max(xx-1,0)])*.5*gain,gy=(Hh[Math.min(yy+1,ch-1)*cw+xx]-Hh[Math.max(yy-1,0)*cw+xx])*.5*gain;map[o]=clamp(128-gx*127,0,255);map[o+1]=clamp(128-gy*127,0,255);map[o+3]=Math.max(map[o+3],a*255)}}}});
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,Tm);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,MW,MH,0,gl.RGBA,gl.UNSIGNED_BYTE,map);
 const r=g.getBoundingClientRect(),px=17*gw/1000;gl.uniform4f(GU.uR,r.left/W,r.top/H,r.width/W,r.height/H);gl.uniform2f(GU.uS,px/W,px/H)}
function drawGlass(){if(mapDirty){buildMap();mapDirty=0}gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,Tb);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function applyGlass(){glOn=S.glass==='gl'&&(gl||initGL());document.body.classList.toggle('glx',!!glOn);mapDirty=1}
/* ---------- settings ---------- */
let editing=null;const mj=$('mj');
$('ow').innerHTML='<option value="auto">Weather: live</option>'+Object.keys(OW).map(k=>`<option value="${k}">Preview: ${k}</option>`).join('');
$('ot').innerHTML='<option value="auto">Time of day: live</option>'+Object.keys(OT).map(k=>`<option value="${k}">Preview: ${OT[k].l}</option>`).join('');
$('mp').innerHTML+=PN.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
function listM(){$('ml').innerHTML=S.moths.map((m,i)=>{let v='';try{v=MothLib.renderMoth({...m.params,view:'top'},{free:true})}catch(e){}return`<div class="mr"><div class="pv">${v}</div><span><b>${m.name}</b></span><button data-e="${i}">Edit</button><button data-d="${i}">✕</button><label class="sl">Size <input type="range" data-s="${i}" min="10" max="400" value="${Math.round((m.scale||1)*100)}" title="Double-click to reset"><b>${Math.round((m.scale||1)*100)}%</b><small data-c="${m.id}"></small></label></div>`}).join('');refreshCaps()}
/* per-moth size slider: updates the saved moth and the live one without respawning it */
$('ml').oninput=e=>{const t=e.target;if(t.dataset.s==null)return;const m=S.moths[+t.dataset.s];if(!m)return;m.scale=+t.value/100;t.nextElementSibling.textContent=t.value+'%';const r=R.find(q=>q.id===m.id);if(r){r.scale=m.scale;sizeMoths()}save()};
function syncSet(){listM();$('lm').value=S.loc.mode;$('ln').value=S.loc.name||'';$('ow').value=S.ovW;$('ot').value=S.ovT;$('sz').value=S.size;$('szv').textContent=S.size;$('rl').checked=S.real!==false;
 $('cx').value=S.capMax||40;$('cxv').textContent=S.capMax||40;$('cn').value=S.capMin||20;$('cnv').textContent=S.capMin||20;$('gm').value=S.glass;$('gf').value=S.gfps;$('gfv').textContent=S.gfps}
$('ml').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d!=null){S.moths.splice(+b.dataset.d,1);save();spawnAll();listM()}
 if(b.dataset.e!=null){const m=S.moths[+b.dataset.e];editing=m.id;$('mn').value=m.name;$('mo').value=m.notes||'';mj.value=JSON.stringify(m.params);$('ma').textContent='Save changes';$('mc').hidden=false}};
const resetForm=()=>{editing=null;$('mn').value=$('mo').value=mj.value='';$('ma').textContent='Add moth';$('mc').hidden=true;$('mp').value=''};
$('mc').onclick=resetForm;
$('mp').onchange=e=>{if(e.target.value==='')return;const n=PN[+e.target.value];mj.value=JSON.stringify(preset(n));if(!$('mn').value)$('mn').value=n};
$('ma').onclick=()=>{const name=$('mn').value.trim();let p;try{p=JSON.parse(mj.value.replace(/([:\[,]\s*)(-?)\.(\d)/g,'$10.$3'));p=MothLib.constrain(MothLib.full(p));MothLib.renderMoth({...p,view:'top'},{free:true})}catch(x){$('me').textContent='Could not read that JSON: '+x.message;return}
 if(!name){$('me').textContent='Give your moth a name.';return}$('me').textContent='';
 const e=S.moths.find(m=>m.id===editing),o={name,notes:$('mo').value.trim(),params:p};if(e)Object.assign(e,o);else S.moths.push({id:'m'+Date.now(),...o});save();resetForm();spawnAll();listM()};
$('lm').onchange=e=>{S.loc.mode=e.target.value;save();refreshWx()};
$('lg').onclick=async()=>{const n=$('ln').value.trim();if(!n)return;$('ls').textContent='Searching…';try{const j=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(n))).json(),r=j.results[0];S.loc={mode:'manual',name:r.name+(r.admin1?', '+r.admin1:''),lat:r.latitude,lon:r.longitude};$('ls').textContent='Using '+S.loc.name;$('lm').value='manual';save();refreshWx()}catch(e){$('ls').textContent='Could not find that place.'}};
$('ow').onchange=e=>{S.ovW=e.target.value;save()};$('ot').onchange=e=>{S.ovT=e.target.value;save()};
$('gm').onchange=e=>{S.glass=e.target.value;save();applyGlass()};$('gf').oninput=e=>{S.gfps=+e.target.value;$('gfv').textContent=S.gfps;save()};
$('sz').oninput=e=>{S.size=+e.target.value;$('szv').textContent=S.size;save();sizeMoths()};
$('rl').onchange=e=>{S.real=e.target.checked;save();sizeMoths()};
$('cx').oninput=e=>{S.capMax=+e.target.value;$('cxv').textContent=S.capMax;save();sizeMoths()};
$('cn').oninput=e=>{S.capMin=+e.target.value;$('cnv').textContent=S.capMin;save();sizeMoths()};
/* double-click a moth's slider to put it back to 100% (its true size relative to the others) */
$('ml').ondblclick=e=>{const t=e.target;if(t.dataset.s==null)return;const m=S.moths[+t.dataset.s];if(!m)return;m.scale=1;t.value=100;t.nextElementSibling.textContent='100%';
 const r=R.find(q=>q.id===m.id);if(r){r.scale=1;sizeMoths()}save()};
const fsT=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('fs').onclick=fsT;
const setOpen=v=>{$('set').hidden=!v;if(v)syncSet();else wake()};$('gear').onclick=()=>setOpen($('set').hidden);$('x1').onclick=()=>setOpen(false);
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.key!=='Escape')return;if(e.key=='s')setOpen($('set').hidden);if(e.key=='f')fsT();if(e.key=='Escape'){setOpen(false);closeInfo()}});
$('bg').onclick=$('glass').onclick=()=>closeInfo();document.addEventListener('click',e=>{if(!e.target.closest('.moth,#info,#set,#gear'))closeInfo()});
/* ---------- idle cursor ---------- */
let idleT;function wake(){document.documentElement.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if($('set').hidden&&$('info').hidden)document.documentElement.classList.add('idle')},2500)}
['mousemove','mousedown','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake));wake();
/* ---------- clock tick ---------- */
function tick(){const n=new Date(),w=curWx(),d=derive(w),s=curSun();
 const tp=TF.formatToParts(n).filter(p=>p.type!=='dayPeriod'&&!(p.type=='literal'&&/^\s+$/.test(p.value))).map(p=>p.value).join('');
 setT('time',tp);setT('date',DF.format(n));
 setT('wx',REAL.ok||OW[S.ovW]?`${Math.round(w.temp)}° · ${d.label}`:'Weather unavailable');
 setT('sub',`${OT[S.ovT]?.l||phaseOf(s.alt,s.H)}${REAL.ok||OW[S.ovW]?` · Feels ${Math.round(w.feels)}° · ${Math.round(w.hum)}% · ${Math.round(w.wind)} km/h`:''}`)}
addEventListener('resize',()=>{resize();sizeMoths()});
applyGlass();resize();spawnAll();tick();setInterval(tick,1000);refreshWx();setInterval(refreshWx,6e5);
if(document.fonts)document.fonts.ready.then(()=>{mapDirty=1});requestAnimationFrame(frame);
})();
</script></body></html>
